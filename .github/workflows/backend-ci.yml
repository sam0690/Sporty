name: Backend CI

on:
  push:
    branches: [main]
    paths: ["Sporty_Backend/**"]
  pull_request:
    paths: ["Sporty_Backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sporty_Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Sporty_Backend/requirements.txt

      - run: pip install -r requirements.txt pytest

      # conftest.py os.environ.setdefault()s every required Settings field —
      # no secrets/services needed, the suite is pure-function + SQLite/fakes.
      - run: python -m pytest -q
