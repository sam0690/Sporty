name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["sporty-frontend/**"]
  pull_request:
    paths: ["sporty-frontend/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sporty-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn lint

      - run: yarn tsc --noEmit
